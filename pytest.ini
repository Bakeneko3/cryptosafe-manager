[pytest]
testpaths = tests
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gui:  marks tests that require a graphical environment
    perf: marks performance tests

addopts =
    --strict-markers
    --strict-config