[pytest]
testpaths = tests
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gui:  marks tests that require a graphical environment
    perf: marks performance tests

addopts =
    --strict-markers
    --strict-config

# Coverage settings (used when --cov is passed)
# Run: pytest --cov=src --cov-report=term-missing --cov-report=html